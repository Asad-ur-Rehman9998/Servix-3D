name: servix_3d
description: Servix 3D — Smart On-Demand Services marketplace. Portfolio-grade Flutter app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.0
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  equatable: ^2.0.7
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  smooth_page_indicator: ^1.2.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/animations/
    - .env.example
